name: Deploy Dev

# FORHU/ilovelawyer-client → the shared dev host (ap-southeast-1),
# served at https://app-dev.ilovelawyer.com — the dev copy of what will become
# app.ilovelawyer.com. This is the client for USERS; ph.* and uk.* are the
# lawyer-facing app and stay on the ilovelawyer-app container.
#
# One EC2 instance runs every project's dev environment. This workflow owns
# only its own container; it cannot touch another project's, and the deploy
# role cannot reach any host but this one.
#
# Configuration, in two halves as in ilovelawyer-app:
#   - Build time: this repo's GitHub `staging` environment, written to
#     .env.staging by "Write web env file" before the image is
#     built, as ilovelawyer-app writes its .env.staging; next.config.ts loads it.
#     Everything in it is NEXT_PUBLIC_*, inlined by
#     `next build`; setting them later changes nothing.
#   - Runtime: "Publish project env" puts ENV_PARAM in Parameter Store; the
#     deploy writes it to MERGED_ENV under /opt/forhu-dev on the host, as the
#     api and app do, and starts the container with --env-file.
# No shared credentials file (ilovelawyer-app merges one in): nothing in the
# client needs the database, Redis or the other host credentials, so it isn't
# given them.
#
# BEFORE THE FIRST RUN
#   1. Repository variable:
#        AWS_DEV_DEPLOY_ROLE_ARN = arn:aws:iam::617163942417:role/forhu-deploy
#      A new name on purpose: AWS_DEPLOY_ROLE_ARN already points at production
#      in several repos, and in gate-closes-api it switches the deploy target.
#   2. The ECR repository must exist — nothing here creates it:
#        aws ecr create-repository --repository-name ilovelawyer-client \
#          --region ap-southeast-1
#   3. HOST_PORT 4036 is free in ilovelawyer's 4030-4039 band (4030-4032 dev,
#      4033-4035 production). Confirm against /etc/caddy/sites/00-PORTS.md
#      before the first run and add it there after.
#   4. `staging` environment secrets, the names src/ reads: NEXT_PUBLIC_API_URL,
#      NEXT_PUBLIC_LAWYER_APP_URL and NEXT_PUBLIC_GOOGLE_CLIENT_ID. The deploy
#      stops if any is empty.
#   5. The deploy role may write, and the host's instance role read, ENV_PARAM
#      — as they do /forhu-dev/ilovelawyer-api/env and /forhu-dev/ilovelawyer-app/env.

on:
  # Dev tracks main. Without this the dev container only changes when somebody
  # remembers to dispatch, and it silently falls behind: on 2026-10-16 ilovelawyer
  # dev was 24h and several merges stale while production deployed on every merge,
  # which read as "changes not propagating" rather than as a missing trigger.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        # No default: repos in this org disagree on a default branch name, and a
        # hardcoded one fetches a branch that may not exist, failing in checkout
        # before anything is built. Blank falls back to github.ref_name.
        description: "Branch, tag or SHA to deploy (blank = the branch you ran this from)"
        required: false

# Shared with the other ilovelawyer dev workflows: they deploy to the same host
# and the same `docker image prune -af` would pull the rug from under a build
# running beside it.
concurrency:
  group: forhu-dev-ilovelawyer
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  ACCOUNT_ID: "617163942417"
  INSTANCE_ID: i-0f95a93145ea25e7a
  ECR_REPOSITORY: ilovelawyer-client
  CONTAINER: ilovelawyer-client-dev
  NETWORK: forhu-dev
  HOST_PORT: "4036"
  APP_PORT: "3002"
  ENV_PARAM: /forhu-dev/ilovelawyer-client/env
  MERGED_ENV: /opt/forhu-dev/ilovelawyer-client-dev.env

jobs:
  deploy:
    name: Build and deploy (ilovelawyer client dev)
    # Native arm64: the host is Graviton. An image built on ubuntu-latest is
    # amd64, pulls cleanly, then dies with "exec format error". Do not
    # cross-build under QEMU — Node builds take hours and look hung.
    runs-on: ubuntu-24.04-arm
    environment: staging

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref_name }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEV_DEPLOY_ROLE_ARN || 'arn:aws:iam::617163942417:role/forhu-deploy' }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve image tag
        id: tag
        run: |
          # dev- prefix so a dev image can never be mistaken for, or overwrite,
          # a production tag in the same ECR repository.
          echo "tag=dev-$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "registry=${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "${{ env.AWS_REGION }}" \
            | docker login --username AWS --password-stdin "${{ steps.tag.outputs.registry }}"

      # The values from GitHub, as the image's .env.staging — the
      # file `next build` reads NEXT_PUBLIC_* from (next.config.ts loads it),
      # inlining them into the bundle. It
      # must exist before the image is built: the builder stage's `COPY . .`
      # carries it in. Passing these to `docker run -e` instead would leave the
      # bundle calling localhost from the tester's browser, with nothing in any log.
      - name: Write web env file
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_LAWYER_APP_URL: ${{ secrets.NEXT_PUBLIC_LAWYER_APP_URL }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
        run: |
          set -euo pipefail
          # Each of these compiles and deploys when empty, then fails with nothing
          # in any log. Fail here instead, as ilovelawyer-app does for the client ID.
          # An empty NEXT_PUBLIC_API_URL left /files/<token> — which calls the API
          # from the server, where a relative URL can't be fetched — unable to
          # open any document; an empty NEXT_PUBLIC_LAWYER_APP_URL sends lawyers
          # to the local default, http://uk.ilovelawyer.local:3002.
          for name in NEXT_PUBLIC_API_URL NEXT_PUBLIC_LAWYER_APP_URL NEXT_PUBLIC_GOOGLE_CLIENT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::${name} is empty. Add it to the 'staging' environment."
              exit 1
            fi
          done
          cat > "${{ github.workspace }}/.env.staging" << EOF
          NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
          NEXT_PUBLIC_LAWYER_APP_URL=${NEXT_PUBLIC_LAWYER_APP_URL}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # No build-args: the values are in .env.staging, written above.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/arm64
          provenance: false
          tags: ${{ steps.tag.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}

      # This project's env, as MERGED_ENV on the host. Anything unset is omitted
      # rather than written empty: an empty value looks configured and silently
      # disables whatever reads it.
      - name: Publish project env to Parameter Store
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_LAWYER_APP_URL: ${{ secrets.NEXT_PUBLIC_LAWYER_APP_URL }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
        run: |
          set -euo pipefail
          umask 077

          # The NEXT_PUBLIC_* values are the same secrets the build inlined from
          # .env.staging, so the host file shows what this deploy was built with.
          # They are a record, not settings: the app uses the inlined copy, so
          # editing them here and restarting changes nothing. Change the secret
          # in the `staging` environment and redeploy instead. PORT/HOSTNAME come
          # from the Dockerfile.
          {
            printf 'NODE_ENV=production\n'
            for name in NEXT_PUBLIC_API_URL NEXT_PUBLIC_LAWYER_APP_URL NEXT_PUBLIC_GOOGLE_CLIENT_ID; do
              if [ -n "${!name:-}" ]; then printf '%s=%s\n' "$name" "${!name}"; fi
            done
          } > env.tmp

          aws ssm put-parameter \
            --name "${{ env.ENV_PARAM }}" \
            --type SecureString --overwrite \
            --value "file://env.tmp" \
            --region "${{ env.AWS_REGION }}" > /dev/null
          rm -f env.tmp

      - name: Deploy via SSM
        id: send
        env:
          REGISTRY: ${{ steps.tag.outputs.registry }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${{ env.ECR_REPOSITORY }}:${TAG}"

          # MERGED_ENV is ENV_PARAM alone: no shared credentials file to merge in
          # (see the header). PORT and HOSTNAME come from the Dockerfile.
          COMMANDS=(
            "set -euo pipefail"
            "aws ssm get-parameter --name ${{ env.ENV_PARAM }} --with-decryption --region ${{ env.AWS_REGION }} --query Parameter.Value --output text > ${{ env.MERGED_ENV }}"
            "chmod 600 ${{ env.MERGED_ENV }}"
            "aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${REGISTRY}"
            "docker container prune -f || true"
            "docker image prune -af || true"
            "docker pull --platform linux/arm64 ${IMAGE}"
            "docker rm -f ${{ env.CONTAINER }} 2>/dev/null || true"
            "docker run -d --name ${{ env.CONTAINER }} --restart unless-stopped --platform linux/arm64 --network ${{ env.NETWORK }} --env-file ${{ env.MERGED_ENV }} -p 127.0.0.1:${{ env.HOST_PORT }}:${{ env.APP_PORT }} ${IMAGE}"
          )

          # jq builds the JSON, so a quote inside any command cannot break it.
          PARAMS=$(printf '%s\n' "${COMMANDS[@]}" | jq -R . | jq -sc '{commands: .}')

          CMD_ID=$(aws ssm send-command \
            --region "${{ env.AWS_REGION }}" \
            --instance-ids "${{ env.INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${{ env.CONTAINER }} ${TAG}" \
            --timeout-seconds 900 \
            --parameters "${PARAMS}" \
            --query Command.CommandId --output text)

          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command: $CMD_ID"

      - name: Wait for the deploy
        run: |
          set -uo pipefail
          STATUS=Pending
          for i in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation \
              --region "${{ env.AWS_REGION }}" \
              --command-id "${{ steps.send.outputs.command_id }}" \
              --instance-id "${{ env.INSTANCE_ID }}" \
              --query Status --output text 2>/dev/null || echo Pending)
            echo "status: $STATUS"
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 10
          done

          aws ssm get-command-invocation \
            --region "${{ env.AWS_REGION }}" \
            --command-id "${{ steps.send.outputs.command_id }}" \
            --instance-id "${{ env.INSTANCE_ID }}" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text

          [ "$STATUS" = "Success" ] || { echo "::error::deploy $STATUS"; exit 1; }
